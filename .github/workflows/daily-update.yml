name: 每日更新指数增强基金排名

on:
  schedule:
    # 北京时间次日 07:00 (UTC 23:00) 周二~周六，确保前一个交易日净值已公布完毕
    # 天天基金净值通常在当晚 18:00-22:00 陆续公布，次日清晨一定可用
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: '回填全部历史日期数据（仅需运行一次）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复数据缓存
        uses: actions/cache@v4
        id: cache-data
        with:
          path: |
            data/nav/
            data/index/
            data/return/
            data/fund_master.parquet
            data/fund_detail_cache.parquet
          key: fund-data-v3-${{ runner.os }}-${{ github.run_date }}
          restore-keys: |
            fund-data-v3-${{ runner.os }}-

      # 01 仅在白名单 Excel 变动时手动运行（日常跳过）
      # - name: 01 更新基金池
      #   run: python 01_build_fund_pool1.py

      - name: 02 获取最新净值
        run: python 02_update_nav.py

      - name: 校验 NAV 数据新鲜度
        run: |
          python -c "
          import pandas as pd, os, sys
          from datetime import date, timedelta
          from pathlib import Path

          nav_dir = Path('data/nav')
          if not nav_dir.exists() or not list(nav_dir.glob('*.parquet')):
              print('[FATAL] data/nav/ 目录为空，02 步骤可能完全失败')
              sys.exit(1)

          # 找到所有基金 NAV 文件中的最新日期
          latest_dates = []
          empty_files = []
          for f in sorted(nav_dir.glob('*.parquet')):
              try:
                  df = pd.read_parquet(f)
                  if df.empty or 'date' not in df.columns:
                      empty_files.append(f.stem)
                      continue
                  df['date'] = pd.to_datetime(df['date']).dt.date
                  latest_dates.append(df['date'].max())
              except Exception as e:
                  print(f'[WARN] 读取 {f.name} 失败: {e}')

          if not latest_dates:
              print('[FATAL] 所有 NAV 文件均为空或无法读取')
              sys.exit(1)

          nav_latest = max(latest_dates)
          today = date.today()

          # 计算"应该已有净值"的最近交易日
          # 净值在交易日当晚公布，所以今早运行时"今天"的净值可能还没出
          # → 用昨天倒推，跳过周末
          yesterday = today - timedelta(days=1)
          expected = yesterday
          while expected.weekday() >= 5:  # 周六(5)/周日(6) → 继续回退
              expected = expected - timedelta(days=1)

          # 计算交易日差距（跳过周末）
          gap = 0
          cur = expected
          while cur > nav_latest:
              gap += 1
              cur = cur - timedelta(days=1)
              while cur.weekday() >= 5:
                  cur = cur - timedelta(days=1)

          print(f'NAV 最新日期: {nav_latest}')
          print(f'应有净值日期: {expected}')
          print(f'滞后交易日数: {gap}')
          print(f'有效文件数:   {len(latest_dates)}')

          if empty_files:
              print(f'[WARN] 空文件 ({len(empty_files)}): {empty_files[:5]}...')

          if gap > 0:
              print(f'[FATAL] NAV 滞后 {gap} 个交易日，拒绝继续')
              print(f'  应有净值日期: {expected}，实际 NAV 最新: {nav_latest}')
              print(f'  可能原因: API 数据源未更新 / 大面积请求失败')
              sys.exit(1)
          else:
              print('[OK] NAV 数据为最新可用交易日')
          "

      - name: 03 计算涨跌幅与超额（回填时也运行，确保指数数据刷新）
        run: python 03_calculate_return.py

      - name: 历史数据回填（仅手动触发，一次性）
        if: ${{ inputs.backfill }}
        run: python 03_backfill_history.py

      - name: 诊断 日超额
        run: |
          python -c "
          import pandas as pd
          excess = pd.read_parquet('data/return/excess_return.parquet')
          idx = pd.read_parquet('data/return/index_return.parquet')
          for fund in ['023119', '000176']:
              e = excess[excess['fund_code'] == fund]
              if e.empty: continue
              bm = e.iloc[-1].get('benchmark_index', '?')
              print(f'=== {fund} (benchmark={bm}) ===')
              for _, r in e.sort_values('date').tail(3).iterrows():
                  fc = r.get('daily_change', float('nan'))
                  fe = r.get('daily_excess', float('nan'))
                  print(f'  {r[\"date\"]} | fund={fc*100:.4f}% | excess={fe*100:.4f}%')
              # 对应指数
              ibm = idx[idx['index_code'] == bm]
              print(f'  指数 {bm}:')
              for _, r in ibm.sort_values('date').tail(3).iterrows():
                  ic = r.get('daily_change', float('nan'))
                  print(f'    {r[\"date\"]} | index_daily={ic*100:.4f}%')
              # 反算最新
              ed = e.sort_values('date').iloc[-1]
              id_row = ibm[ibm['date'] == ed['date']]
              if len(id_row) > 0:
                  fc, ic = ed['daily_change'], id_row.iloc[0]['daily_change']
                  manual = fc - 0.95 * ic
                  print(f'  反算: {fc*100:.4f}% - 0.95*({ic*100:.4f}%) = {manual*100:.4f}%  |  HTML: {ed[\"daily_excess\"]*100:.4f}%')
              print()
          "

      - name: 04 生成绩效 HTML
        run: python 04_generate_html.py

      - name: 05 生成研究分析 Excel
        run: python 05_export_analysis.py
        continue-on-error: true

      - name: 06 生成研究 HTML 看板
        run: python 06_generate_research_html.py
        continue-on-error: true

      - name: 验证数据日期
        id: validate
        run: |
          python -c "
          import pandas as pd, os, sys
          from datetime import date, timedelta
          path = 'data/return/excess_return.parquet'
          if not os.path.exists(path):
              print(f'[FATAL] {path} 不存在，数据流水线可能失败')
              sys.exit(1)
          df = pd.read_parquet(path)
          latest = pd.to_datetime(df['date'].max()).date()
          today = date.today()

          # 计算"应该已有数据"的最近交易日（同 NAV 新鲜度校验）
          yesterday = today - timedelta(days=1)
          expected = yesterday
          while expected.weekday() >= 5:
              expected = expected - timedelta(days=1)

          # 交易日差距
          gap = 0
          cur = expected
          while cur > latest:
              gap += 1
              cur = cur - timedelta(days=1)
              while cur.weekday() >= 5:
                  cur = cur - timedelta(days=1)

          print(f'数据日期: {latest}')
          print(f'应有数据日期: {expected}')
          print(f'滞后交易日数: {gap}')

          if gap > 1:
              print(f'[FATAL] 数据滞后 {gap} 个交易日，拒绝部署陈旧数据')
              print(f'  可能原因: API 数据源异常 / 长时间假期 / 上游流水线失败')
              sys.exit(1)
          elif gap == 1:
              print(f'[WARN] 数据滞后 1 个交易日，继续部署')
          else:
              print('[OK] 数据为最新可用交易日')
          # 输出版本日期供邮件使用
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'data_date={latest}\n')
          "

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 发送更新通知邮件
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.163.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 📊 指数增强基金排名已更新 — ${{ steps.validate.outputs.data_date }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          html_body: |
            <h2>📊 指数增强基金监控看板</h2>
            <p><strong>数据日期：${{ steps.validate.outputs.data_date }}</strong></p>
            <hr>
            <p>👇 点击以下链接查看最新排名：</p>
            <ul>
              <li><a href="${{ steps.deployment.outputs.page_url }}">📈 绩效排名看板</a></li>
              <li><a href="${{ steps.deployment.outputs.page_url }}research.html">🔬 研究分析看板</a></li>
            </ul>
            <hr>
            <p style="color: #888; font-size: 12px;">由 GitHub Actions 自动发送 · <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行日志</a></p>
